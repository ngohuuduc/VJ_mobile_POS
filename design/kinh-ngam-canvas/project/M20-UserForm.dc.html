<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm user · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF0EE;font-family:"Barlow","Segoe UI",sans-serif;color:#1A1F24}
a{color:#1A1F24;text-decoration:none}a:hover{color:#8A5A00}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="muf-title" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FFFFFF; font-family: Barlow, sans-serif; color: #1A1F24">
  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 4px; border-bottom: 1px solid #D6DBD8">
    <a href="M19-Users.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 id="muf-title" style="margin: 0; flex-grow: 1; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 20px">Thêm user</h1>
  </div>
  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Họ tên
      <input type="text" value="Võ Thanh Tâm" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-size: 16px; font-weight: 400">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Tên đăng nhập
        <input type="text" value="tamvt" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-size: 16px; font-weight: 500">
      </label>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="muf-role" style="font-size: 14px; font-weight: 500">Vai trò</span>
        <div role="group" aria-labelledby="muf-role" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border: 1px solid #9AA5A0; border-radius: 10px">
          <sc-for list="{{ roles }}" as="r" hint-placeholder-count="2">
            <sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-pressed="true" onClick="{{ r.pick }}" style="height: 38px; border: 0; border-radius: 8px; background: #1A1F24; color: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 15px">{{ r.label }}</button>
            </sc-if>
            <sc-if value="{{ r.off }}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-pressed="false" onClick="{{ r.pick }}" style="height: 38px; border: 0; border-radius: 8px; background: transparent; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px">{{ r.label }}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Email
      <input type="email" value="tamvt@vjshop.vn" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-size: 16px; font-weight: 400">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="muf-wh" style="font-size: 14px; font-weight: 500">Kho được phép</span>
      <div role="group" aria-labelledby="muf-wh" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{ whs }}" as="w" hint-placeholder-count="2">
          <sc-if value="{{ w.on }}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-pressed="true" onClick="{{ w.pick }}" style="height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #1A1F24; border-radius: 8px; background: #1A1F24; color: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{ w.label }}</button>
          </sc-if>
          <sc-if value="{{ w.off }}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="false" onClick="{{ w.pick }}" style="height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 8px; background: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>{{ w.label }}</button>
          </sc-if>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #66716C">{{ roleHint }}</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Liên kết nhân viên Odoo
      <span style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-size: 16px; font-weight: 400">
        <span style="flex-grow: 1">Võ Thanh Tâm <span style="color: #4E5A55">· Bán hàng 23CTO</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="muf-pw" style="font-size: 14px; font-weight: 500">Mật khẩu</label>
      <div style="position: relative">
        <input id="muf-pw" type="password" value="Vjshop@2026" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 52px 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-size: 16px">
        <button type="button" aria-label="Hiện mật khẩu" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #4E5A55"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; font-size: 13px; font-weight: 500; color: #17663F">
        <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tối thiểu 8 ký tự</span>
        <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Có chữ hoa (A-Z)</span>
        <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Có chữ số (0-9)</span>
        <span style="display: inline-flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Có ký tự đặc biệt</span>
      </div>
    </div>
  </div>
  <div style="flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid #D6DBD8; background: #FFFFFF">
    <a href="M19-Users.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 20px; border: 1px solid #9AA5A0; border-radius: 10px; font-size: 16px; font-weight: 600">Huỷ</a>
    <a href="M19-Users.dc.html" style="flex-grow: 1; display: inline-flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #F0A500; color: #1A1F24; font-size: 16px; font-weight: 600">Lưu</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const role = st.role || 'POS';
    const wh = st.wh || { '23CTO/Stock': true, 'BMT/Stock': false };
    return {
      roles: ['ADMIN', 'POS'].map((r) => ({
        label: r, on: r === role, off: r !== role,
        pick: () => this.setState({ role: r })
      })),
      whs: ['23CTO/Stock', 'BMT/Stock'].map((w) => ({
        label: w, on: !!wh[w], off: !wh[w],
        pick: () => this.setState({ wh: Object.assign({}, wh, { [w]: !wh[w] }) })
      })),
      roleHint: role === 'ADMIN'
        ? 'ADMIN bán hàng và vào được mục Quản trị.'
        : 'POS chỉ bán hàng ở các kho được chọn.'
    };
  }
}
</script>
</body>
</html>
