<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const img = st.img !== false;
    const size = st.size || 'K80';
    return {
      imgOn: img,
      imgOff: !img,
      toggleImg: () => this.setState({ img: !img }),
      sizes: ['A4', 'A5', 'K80'].map((s) => ({
        label: s, on: s === size, off: s !== size,
        pick: () => this.setState({ size: s })
      }))
    };
  }
}
</script>
