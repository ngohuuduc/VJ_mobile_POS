<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chuyển cọc · Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF0EE;font-family:"Barlow","Segoe UI",sans-serif;color:#1A1F24}
a{color:#1A1F24;text-decoration:none}a:hover{color:#8A5A00}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="m13-title" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Barlow, sans-serif; color: #1A1F24; font-size: 15px">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; background: #FFFFFF; border-bottom: 1px solid #D6DBD8">
    <a href="M10-Orders.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 id="m13-title" style="margin: 0; flex-grow: 1; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 20px">Chuyển cọc · S04498</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow: auto; box-sizing: border-box; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; background: #EEF0EE">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px; background: #FBE4E1; color: #A1231B; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 14px">Đã huỷ trên Odoo</span>
      <span style="font-size: 14px; color: #4E5A55">Vũ Thị Lệ Phương</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #4E5A55">Khoản cọc của đơn</h2>
      <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #D6DBD8; border-radius: 14px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #D6DBD8">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 16px">BNK1/2026/00312</span>
            <span style="font-size: 14px; color: #4E5A55">Chuyển khoản · 20/09/2026</span>
          </div>
          <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 16px">10.000.000 ₫</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px">
          <span style="font-weight: 600">Tổng cọc</span>
          <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 21px">10.000.000 ₫</span>
        </div>
      </div>
    </div>

    <div role="radiogroup" aria-labelledby="m13-choice" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="m13-choice" style="margin: 0; font-size: 14px; font-weight: 600; color: #4E5A55">Xử lý tiền cọc</h2>
      <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid {{ applyBd }}; border-radius: 14px">
        <button type="button" role="radio" aria-checked="{{ applyChecked }}" onClick="{{ pickApply }}" style="min-height: 52px; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 0; background: transparent; text-align: left; font-family: Barlow, sans-serif; color: #1A1F24; cursor: pointer">
          <span style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; margin-top: 1px; border-radius: 50%; border: 2px solid {{ applyRing }}; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{ applyDot }}"></span></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Áp vào đơn mới của cùng khách</span><span style="font-size: 14px; color: #4E5A55">Trừ vào số còn phải thu.</span></span>
        </button>
        <sc-if value="{{ isApply }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 14px 12px">
            <label for="m13-target" style="font-size: 13px; font-weight: 600; color: #4E5A55">Đơn nhận cọc</label>
            <select id="m13-target" style="height: 48px; box-sizing: border-box; padding: 0 10px; border: 1px solid #9AA5A0; border-radius: 10px; background: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-size: 16px; font-weight: 600; color: #1A1F24">
              <option>S04512 · còn thu 74.480.000 ₫</option>
            </select>
          </div>
        </sc-if>
      </div>
      <button type="button" role="radio" aria-checked="{{ creditChecked }}" onClick="{{ pickCredit }}" style="min-height: 52px; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid {{ creditBd }}; border-radius: 14px; background: #FFFFFF; text-align: left; font-family: Barlow, sans-serif; color: #1A1F24; cursor: pointer">
        <span style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; margin-top: 1px; border-radius: 50%; border: 2px solid {{ creditRing }}; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{ creditDot }}"></span></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Giữ làm công nợ của khách</span><span style="font-size: 14px; color: #4E5A55">Dùng ở bước Thanh toán của đơn sau.</span></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="m13-note" style="font-size: 13px; font-weight: 600; color: #4E5A55">Ghi chú (không bắt buộc)</label>
      <input id="m13-note" type="text" placeholder="VD: Khách đổi sang A7 IV" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D6DBD8; border-radius: 10px; background: #FFFFFF; font-family: Barlow, sans-serif; font-size: 16px; color: #1A1F24">
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; background: #FCEFCF; border-radius: 10px; font-size: 14px; color: #7A4B00">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>
      <span><strong>Hoàn tiền do kế toán thực hiện trên Odoo.</strong> POS không hoàn tiền cho khách.</span>
    </div>
  </main>

  <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #D6DBD8">
    <a href="M10-Orders.dc.html" style="flex: 1 1 0; height: 52px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #9AA5A0; border-radius: 10px; font-size: 16px; font-weight: 600">Huỷ</a>
    <a href="M11-OrderDetail.dc.html" style="flex: 2.2 1 0; height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; background: #F0A500; color: #1A1F24; font-size: 16px; font-weight: 700">Chuyển cọc <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif">10.000.000 ₫</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const apply = ((this.state && this.state.choice) || 'apply') === 'apply';
    return {
      isApply: apply,
      applyChecked: apply ? 'true' : 'false', creditChecked: apply ? 'false' : 'true',
      applyBd: apply ? '#1A1F24' : '#D6DBD8', creditBd: apply ? '#D6DBD8' : '#1A1F24',
      applyRing: apply ? '#1A1F24' : '#9AA5A0', creditRing: apply ? '#9AA5A0' : '#1A1F24',
      applyDot: apply ? '#1A1F24' : 'transparent', creditDot: apply ? 'transparent' : '#1A1F24',
      pickApply: () => this.setState({ choice: 'apply' }),
      pickCredit: () => this.setState({ choice: 'credit' })
    };
  }
}
</script>
</body>
</html>
