<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sơ đồ màn hình VJ POS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF0EE;font-family:"Barlow","Segoe UI",sans-serif;color:#1A1F24}
a{color:#1A1F24;text-decoration:none}a:hover{color:#8A5A00}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 32px; background: #EEF0EE; font-family: Barlow, sans-serif; color: #1A1F24">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <img src="/_blob/ca4bc8854f059ad7465e93434a0ee522" alt="VJShop.vn" style="height: 36px; width: auto; align-self: flex-start">
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05">POS · Kính ngắm</h1>
      <p style="margin: 0; font-size: 18px; color: #4E5A55">23 màn hình × 3 thiết bị. Chọn một thiết bị để mở màn hình đó.</p>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; font-size: 15px; color: #4E5A55">
      <span style="display: inline-flex; width: 14px; height: 14px; border-radius: 4px; background: #F0A500"></span>
      <span>Hành động chính</span>
      <span style="display: inline-flex; width: 14px; height: 14px; border-radius: 4px; background: #1A1F24; margin-left: 16px"></span>
      <span>Mực / chọn</span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex-grow: 1; min-height: 0">
    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="3">
      <section style="background: #FFFFFF; border: 1px solid #D6DBD8; border-radius: 14px; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
        <h2 style="margin: 0 0 8px; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-size: 22px; font-weight: 700">{{ sec.name }}</h2>
        <sc-for list="{{ sec.items }}" as="s" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-top: 1px solid #D6DBD8">
            <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px; color: #66716C; width: 26px">{{ s.no }}</span>
            <span style="flex-grow: 1; font-size: 16px; font-weight: 500">{{ s.name }}</span>
            <a href="{{ s.m }}" aria-label="{{ s.name }} trên điện thoại" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 8px; font-size: 14px; font-weight: 600">Mobile</a>
            <a href="{{ s.t }}" aria-label="{{ s.name }} trên iPad" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 8px; font-size: 14px; font-weight: 600">iPad</a>
            <a href="{{ s.d }}" aria-label="{{ s.name }} trên máy tính" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 8px; font-size: 14px; font-weight: 600">Desktop</a>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['Bán hàng', [
        ['01','Login','Đăng nhập'],['02','Prefetch','Tải dữ liệu & chọn kho'],['03','OrderNew','Tạo đơn'],
        ['04','Cart','Giỏ hàng'],['05','Serial','Chọn serial'],['06','CustomerPick','Chọn khách hàng'],
        ['07','CustomerProfile','Profile khách & khuyến mãi'],['08','Payment','Thanh toán'],['09','Success','Tạo đơn thành công']]],
      ['Đơn hàng & kho', [
        ['10','Orders','Danh sách đơn'],['11','OrderDetail','Chi tiết đơn'],['12','Deliver','Giao hàng'],
        ['13','ReleaseDeposit','Chuyển cọc'],['14','PickupDate','Đổi ngày lấy hàng'],['15','Deposit','Thu cọc trước'],
        ['16','Backorder','Backorder & Nháp'],['17','Inventory','Kiểm tra tồn kho']]],
      ['Cài đặt & quản trị', [
        ['18','Settings','Cài đặt'],['19','Users','Quản lý User'],['20','UserForm','Thêm / sửa User'],
        ['21','Templates','Quản lý Template'],['22','Cache','Cache Management'],['23','PaymentMethods','Phương thức thanh toán']]]
    ];
    return {
      sections: S.map(([name, items]) => ({
        name,
        items: items.map(([no, slug, label]) => ({
          no, name: label,
          m: 'M' + no + '-' + slug + '.dc.html',
          t: 'T' + no + '-' + slug + '.dc.html',
          d: 'D' + no + '-' + slug + '.dc.html'
        }))
      }))
    };
  }
}
</script>
</body>
</html>
