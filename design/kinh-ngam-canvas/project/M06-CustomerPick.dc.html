<style>

</style>

<div role="dialog" aria-modal="true" aria-labelledby="m06-title" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Barlow, sans-serif; color: #1A1F24">
  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; border-bottom: 1px solid #D6DBD8">
    <a href="M04-Cart.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 id="m06-title" style="margin: 0; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 20px">Chọn khách hàng</h1>
  </div>

  <div style="padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
    <label for="m06-q" style="font-size: 14px; font-weight: 500; color: #4E5A55">Tìm theo tên, SĐT hoặc MST</label>
    <div style="height: 48px; border-radius: 10px; background: #EEF0EE; border: 1px solid #9AA5A0; display: flex; align-items: center; gap: 8px; padding: 0 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5A55" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <sc-if value="{{ isRecent }}" hint-placeholder-val="{{ true }}">
        <input id="m06-q" type="search" inputmode="search" placeholder="Tên, 0350 978 833, MST..." style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; height: 44px">
      </sc-if>
      <sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
        <input id="m06-q" type="search" value="0987 654 321" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; height: 44px; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600">
      </sc-if>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 4px 16px 12px">
    <sc-if value="{{ isRecent }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; border: 1px dashed #9AA5A0; border-radius: 10px; margin-bottom: 12px">
        <span style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #9AA5A0; display: inline-flex; align-items: center; justify-content: center; color: #4E5A55; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.2-3.6 4.2-5.5 8-5.5s6.8 1.9 8 5.5"></path></svg></span>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 600">Khách lẻ</div>
          <div style="font-size: 14px; color: #66716C">Không lưu thông tin khách</div>
        </div>
        <a href="M04-Cart.dc.html" style="height: 44px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid #9AA5A0; border-radius: 10px; font-size: 15px; font-weight: 600">Chọn</a>
      </div>
      <div style="font-size: 13px; color: #66716C; padding: 4px 0 6px">Xem gần đây</div>
      <sc-for list="{{ customers }}" as="c" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 6px 0; border-top: 1px solid #D6DBD8">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #EEF0EE; display: inline-flex; align-items: center; justify-content: center; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 18px; flex-shrink: 0">{{ c.init }}</span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.name }}</span>
            <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 500; font-size: 15px; color: #66716C">{{ c.phone }}</span>
            <sc-if value="{{ c.company }}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 6px"><span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 500; font-size: 14px; color: #66716C">{{ c.mst }}</span><span style="height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 8px; background: #EEF0EE; color: #4E5A55; font-size: 13px; font-weight: 500">Doanh nghiệp</span></span>
            </sc-if>
            <sc-if value="{{ c.promo }}" hint-placeholder-val="{{ false }}">
              <span style="align-self: flex-start; height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 8px; background: #FCEFCF; color: #7A4B00; font-size: 13px; font-weight: 600">6 khuyến mãi</span>
            </sc-if>
          </div>
          <a href="M07-CustomerProfile.dc.html" aria-label="Xem profile {{ c.name }}" style="width: 44px; height: 44px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: #4E5A55"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.5 18.5c1.5-2 3.4-3 5.5-3s4 1 5.5 3"></path></svg></a>
          <a href="M04-Cart.dc.html" style="height: 44px; padding: 0 14px; flex-shrink: 0; display: inline-flex; align-items: center; border: 1px solid #9AA5A0; border-radius: 10px; font-size: 15px; font-weight: 600">Chọn</a>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 40px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span style="width: 56px; height: 56px; border-radius: 50%; background: #EEF0EE; display: inline-flex; align-items: center; justify-content: center; color: #4E5A55"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5M8.5 11h5"></path></svg></span>
        <div style="font-size: 16px; font-weight: 600">Không tìm thấy khách hàng.</div>
        <div style="font-size: 15px; color: #4E5A55">Không có khách nào khớp “0987 654 321”. Bạn có muốn tạo mới không?</div>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 20px; border-top: 1px solid #D6DBD8; background: #FFFFFF">
    <sc-if value="{{ isRecent }}" hint-placeholder-val="{{ true }}">
      <button type="button" style="width: 100%; height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #9AA5A0; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Tạo khách mới</button>
    </sc-if>
    <sc-if value="{{ isNotFound }}" hint-placeholder-val="{{ false }}">
      <button type="button" style="width: 100%; height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; background: #F0A500; color: #1A1F24; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Tạo khách mới với SĐT này</button>
    </sc-if>
  </div>

  renderVals() {
    const state = this.props.state ?? 'recent';
    return {
      isRecent: state !== 'notfound',
      isNotFound: state === 'notfound',
      customers: [
        { init: 'V', name: 'Vũ Thị Lệ Phương', phone: '0350 978 833', promo: true, company: false },
        { init: 'T', name: 'Trần Minh Khoa', phone: '0903 112 457', promo: false, company: false },
        { init: 'C', name: 'Công ty TNHH Ảnh Việt', phone: '028 3930 5566', mst: 'MST 0312345678', promo: false, company: true },
        { init: 'L', name: 'Lê Hoàng Anh', phone: '0912 345 678', promo: false, company: false }
      ]
    };
  }
}
</script>
</body>
</html>
