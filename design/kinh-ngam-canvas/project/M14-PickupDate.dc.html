<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đổi ngày lấy hàng – Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF0EE;font-family:"Barlow","Segoe UI",sans-serif;color:#1A1F24}
a{color:#1A1F24;text-decoration:none}a:hover{color:#8A5A00}
button,input{font-family:inherit}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="pd-title" style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: Barlow, sans-serif; color: #1A1F24">

  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; border-bottom: 1px solid #D6DBD8; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 6px">
    <a href="M11-OrderDetail.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #1A1F24"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="flex-grow: 1; display: flex; flex-direction: column">
      <h1 id="pd-title" style="margin: 0; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.15">Đổi ngày lấy hàng</h1>
      <span style="font-size: 13px; color: #66716C"><span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; color: #4E5A55">S04512</span> · Vũ Thị Lệ Phương</span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="background: #EEF0EE; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">Hẹn khách lấy hàng</span><span style="height: 22px; padding: 0 8px; border-radius: 8px; background: #FCEFCF; color: #7A4B00; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">Còn 2 ngày</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #4E5A55">Nguyễn Thị Hường</span><span style="color: #4E5A55">Hạn <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px; color: #1A1F24">28/09/2026</span></span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; color: #4E5A55">Ngày lấy hàng mới</span>
      <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 22px">{{ selLabel }}</span>
      <span style="font-size: 13px; color: #66716C">{{ selDelta }}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
        <sc-if value="{{ c.on }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{ c.pick }}" style="height: 44px; border: 1px solid #1A1F24; border-radius: 8px; background: #1A1F24; color: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px">{{ c.label }}</button>
        </sc-if>
        <sc-if value="{{ c.off }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{ c.pick }}" style="height: 44px; border: 1px solid #9AA5A0; border-radius: 8px; background: #FFFFFF; color: #1A1F24; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px">{{ c.label }}</button>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #D6DBD8; padding-top: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button type="button" aria-label="Tháng trước" disabled style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #9AA5A0; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 17px">Tháng 9 2026</span>
        <button type="button" aria-label="Tháng sau" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #1A1F24; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 13px; color: #66716C; text-align: center">
        <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
          <sc-if value="{{ d.isPast }}" hint-placeholder-val="{{ false }}"><button type="button" disabled aria-label="{{ d.aria }}" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #9AA5A0; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 500; font-size: 16px">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.isToday }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="height: 44px; border: 1.5px solid #1A1F24; border-radius: 8px; background: #FFFFFF; color: #1A1F24; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 16px">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.isOld }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="height: 44px; border: 1px dashed #8A5A00; border-radius: 8px; background: #FCEFCF; color: #7A4B00; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 16px">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.isSel }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="height: 44px; border: 0; border-radius: 8px; background: #1A1F24; color: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 16px">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.isOut }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #66716C; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 500; font-size: 16px">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.isNormal }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #1A1F24; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 500; font-size: 16px">{{ d.n }}</button></sc-if>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; font-size: 13px; color: #4E5A55; padding-top: 6px">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border: 1.5px solid #1A1F24; border-radius: 4px; box-sizing: border-box"></span>Hôm nay</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border: 1px dashed #8A5A00; background: #FCEFCF; border-radius: 4px; box-sizing: border-box"></span>Hạn cũ</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; background: #1A1F24; border-radius: 4px"></span>Ngày chọn</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pd-reason" style="font-size: 14px; font-weight: 500">Lý do</label>
      <input id="pd-reason" type="text" value="Khách đi công tác, hẹn lấy sau" placeholder="VD: Khách hẹn lại lịch" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; font-size: 16px; color: #1A1F24">
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #66716C; line-height: 1.4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#35607F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      <span>Chỉ đổi hạn hoạt động trên Odoo. Chọn từ hôm nay, tối đa 365 ngày.</span>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px 16px; border-top: 1px solid #D6DBD8; background: #FFFFFF">
    <a href="M11-OrderDetail.dc.html" style="height: 48px; padding: 0 18px; border: 1px solid #9AA5A0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Huỷ</a>
    <a href="M11-OrderDetail.dc.html" style="flex-grow: 1; height: 48px; border-radius: 10px; background: #F0A500; color: #1A1F24; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Lưu ngày mới</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var sm = st.sm || 10, sd = st.sd || 3;
    var WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function key(m, d) { return m * 100 + d; }
    var TODAY = key(9, 26), OLD = key(9, 28);
    function pick(m, d) { return function () { self.setState({ sm: m, sd: d }); }; }
    var days = [];
    var lead = (new Date(2026, 8, 1).getDay() + 6) % 7;
    for (var i = 0; i < 35; i++) {
      var dt = new Date(2026, 8, 1 - lead + i);
      var dm = dt.getMonth() + 1, dd = dt.getDate(), k = key(dm, dd);
      var inMonth = dm === 9;
      var past = k < TODAY;
      var sel = !past && dm === sm && dd === sd;
      var today = k === TODAY && !sel;
      var old = !sel && k === OLD;
      var out = !past && !today && !sel && !old && !inMonth;
      var normal = !past && !today && !sel && !old && !out;
      days.push({ n: dd, aria: 'Ngày ' + dd + ' tháng ' + dm, isPast: past, isToday: today, isSel: sel, isOld: old, isOut: out, isNormal: normal, pick: pick(dm, dd) });
    }
    var sel = new Date(2026, sm - 1, sd);
    var diff = Math.round((sel - new Date(2026, 8, 28)) / 86400000);
    var delta = diff === 0 ? 'Trùng hạn cũ' : (diff > 0 ? 'Lùi ' + diff + ' ngày so với hạn cũ' : 'Sớm hơn ' + (-diff) + ' ngày so với hạn cũ');
    var CH = [['+1 ngày', 9, 27], ['+3 ngày', 9, 29], ['+1 tuần', 10, 3]];
    return {
      selLabel: WD[sel.getDay()] + ', ' + pad(sd) + '/' + pad(sm) + '/2026',
      selDelta: delta,
      chips: CH.map(function (c) { var on = c[1] === sm && c[2] === sd; return { label: c[0], on: on, off: !on, pick: pick(c[1], c[2]) }; }),
      days: days
    };
  }
}
</script>
</body>
</html>
