<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tạo đơn · Điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#EEF0EE;font-family:"Barlow","Segoe UI",sans-serif;color:#1A1F24}
a{color:#1A1F24;text-decoration:none}a:hover{color:#8A5A00}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFFFFF; font-family: Barlow, sans-serif; color: #1A1F24; display: flex; flex-direction: column">
  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; background: #FFFFFF; border-bottom: 1px solid #D6DBD8">
    <button type="button" aria-label="Mở menu" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #1A1F24; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <img src="/_blob/ca4bc8854f059ad7465e93434a0ee522" alt="VJShop.vn" style="height: 22px; width: auto">
    <span style="flex-grow: 1"></span>
    <button type="button" aria-label="Kho đang bán: 23CTO/Stock. Đổi kho" style="height: 36px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid #9AA5A0; border-radius: 8px; background: #FFFFFF; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 15px; color: #1A1F24; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6v10H3z"></path><path d="M8 20v-6h8v6"></path></svg>
      23CTO/Stock
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <span role="img" aria-label="Online" style="width: 8px; height: 8px; border-radius: 50%; background: #17663F"></span>
    <span role="img" aria-label="Nguyễn Thị Hường" style="width: 34px; height: 34px; border-radius: 50%; background: #1A1F24; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">H</span>
  </header>
  <div style="flex-shrink: 0; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 4px 0 12px; border: 1px solid #9AA5A0; border-radius: 10px; background: #EEF0EE; color: #4E5A55">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Tìm sản phẩm" placeholder="Tìm SKU / Tên SP / Quét mã vạch..." style="flex-grow: 1; min-width: 0; height: 42px; border: 0; padding: 0; background: transparent; outline: none; font-size: 16px; color: #1A1F24">
      <button type="button" aria-label="Quét mã vạch" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; background: transparent; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #1A1F24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg></button>
    </label>
    <div role="toolbar" aria-label="Lọc theo hãng" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="9">
        <sc-if value="{{ c.sel }}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{ c.pick }}" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 8px; border: 1px solid #1A1F24; background: #1A1F24; color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">{{ c.label }}</button>
        </sc-if>
        <sc-if value="{{ c.off }}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{ c.pick }}" style="height: 36px; flex-shrink: 0; padding: 0 14px; border-radius: 8px; border: 1px solid #9AA5A0; background: #FFFFFF; color: #1A1F24; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer">{{ c.label }}</button>
        </sc-if>
      </sc-for>
    </div>
  </div>
  <div id="catalog" role="list" aria-label="Sản phẩm" style="flex-grow: 1; min-height: 0; overflow: hidden; border-top: 1px solid #D6DBD8">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="8">
      <a role="listitem" href="{{ p.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; box-sizing: border-box; border-bottom: 1px solid #D6DBD8; color: #1A1F24">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
          <span style="font-size: 16px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ p.n }}</span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-size: 14px; font-weight: 500; color: #66716C">{{ p.sku }}</span>
            <sc-if value="{{ p.ok }}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 8px; background: #E1F0E6; color: #17663F; font-size: 13px; font-weight: 600">{{ p.st }}</span></sc-if>
            <sc-if value="{{ p.warn }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 8px; background: #FCEFCF; color: #7A4B00; font-size: 13px; font-weight: 600">{{ p.st }}</span></sc-if>
            <sc-if value="{{ p.bad }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 8px; border: 1px solid #A1231B; background: #FFFFFF; color: #A1231B; font-size: 13px; font-weight: 600">{{ p.st }}</span></sc-if>
          </span>
        </span>
        <span style="flex-shrink: 0; font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 600; font-size: 17px; white-space: nowrap">{{ p.p }}</span>
      </a>
    </sc-for>
  </div>
  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: #1A1F24">
    <a href="M04-Cart.dc.html" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; min-height: 48px; color: #F2F4F2">
      <span style="font-size: 13px; color: #A9B3AE">2 món, xem giỏ</span>
      <span style="font-family: 'Barlow Semi Condensed', Barlow, sans-serif; font-weight: 700; font-size: 21px; color: #F2F4F2">67.480.000 ₫</span>
    </a>
    <a href="M04-Cart.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; background: #F0A500; color: #1A1F24; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg>
      Giỏ hàng
    </a>
  </div>
  <nav aria-label="Điều hướng chính" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #D6DBD8">
    <a href="M03-OrderNew.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: #1A1F24">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>
      <span>Tạo đơn</span>
    </a>
    <a href="M10-Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #66716C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <span>Đơn hàng</span>
    </a>
    <a href="M17-Inventory.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #66716C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg>
      <span>Tồn kho</span>
    </a>
    <a href="M16-Backorder.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #66716C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>Backorder</span>
    </a>
    <a href="M15-Deposit.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: #66716C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M16 13h2M3 10h18"></path></svg>
      <span>Thu cọc</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      { n: 'Sony Alpha A7 IV (Body)', sku: 'SP006401', st: 'Còn 4', k: 'ok', p: '52.990.000 ₫', b: 'Sony', serial: true },
      { n: 'DJI Osmo Pocket 3 Creator Combo', sku: 'SP006312', st: 'Còn 12', k: 'ok', p: '14.490.000 ₫', b: 'DJI' },
      { n: 'Fujifilm X-T5 Kit XF 16-80mm', sku: 'SP006118', st: 'Còn 2', k: 'warn', p: '51.990.000 ₫', b: 'Fujifilm' },
      { n: 'Tamron 28-75mm F2.8 Di III VXD G2 for Sony E', sku: 'SP005920', st: 'Còn 7', k: 'ok', p: '21.490.000 ₫', b: 'Tamron' },
      { n: 'Canon EOS R6 Mark II (Body)', sku: 'SP006050', st: 'Đặt trước', k: 'bad', p: '55.990.000 ₫', b: 'Canon' },
      { n: 'Sigma 24-70mm F2.8 DG DN II Art', sku: 'SP006233', st: 'Còn 3', k: 'ok', p: '28.990.000 ₫', b: 'Sigma' },
      { n: 'K&F Concept Nano-X Black Mist 1/4 67mm', sku: 'SP004410', st: 'Còn 25', k: 'ok', p: '690.000 ₫', b: 'K&F Concept' },
      { n: 'Aputure LS 600d Pro (V-mount)', sku: 'SP006222', st: 'Đặt trước', k: 'bad', p: '48.890.000 ₫', b: 'Khác' }
    ];
    const brands = ['Tất cả', 'DJI', 'Sony', 'Fujifilm', 'Tamron', 'Canon', 'K&F Concept', 'Sigma', 'Khác'];
    const st = Object.assign({ brand: 'Tất cả' }, this.state || {});
    return {
      chips: brands.map((b) => ({ label: b, sel: st.brand === b, off: st.brand !== b, pick: () => this.setState({ brand: b }) })),
      products: P.filter((p) => st.brand === 'Tất cả' || p.b === st.brand).map((p) => Object.assign({}, p, {
        ok: p.k === 'ok', warn: p.k === 'warn', bad: p.k === 'bad',
        href: p.serial ? 'M05-Serial.dc.html' : '#catalog'
      }))
    };
  }
}
</script>
</body>
</html>
