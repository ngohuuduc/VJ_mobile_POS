<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const src = [
      '<div class="receipt k80">',
      '  <h1>Phiếu thu</h1>',
      '  <p>Đơn hàng: {{ order.name }}</p>',
      '  <p>Khách: {{ partner.name }}</p>',
      '  <p class="amount">',
      '    {{ payment.amount | vnd }}',
      '  </p>',
      '  <footer>{{ user.name }}</footer>',
      '</div>'
    ];
    const code = src.map((text, i) => ({
      no: i + 1,
      segs: text.split(/(\{\{.*?\}\}|\{%.*?%\})/).filter((t) => t.length > 0).map((t) => {
        const hl = t.charAt(0) === '{' && (t.charAt(1) === '{' || t.charAt(1) === '%');
        return { t: t, hl: hl, pl: !hl };
      })
    }));
    return { code: code };
  }
}
</script>
